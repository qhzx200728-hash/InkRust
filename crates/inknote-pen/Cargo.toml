[package]
name = "inknote-pen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Net but InkNote: copy nguyen van tu rnote-compose (Rnote, GPLv3). Xem docs/03-port-rnote.md"

[dependencies]
anyhow = "1.0"
approx = "0.5.1"
base64 = "0.23.1"
clap = { version = "4.6", features = ["derive"], optional = true }
ink-stroke-modeler-rs = "0.1.0"
kurbo = "0.13.1"
num-derive = "0.5.1"
num-traits = "0.2.19"
once_cell = "1.21"
palette = "0.7.7"
parry2d-f64 = { version = "0.31.1", features = ["serde-serialize"] }
piet = "0.8.0"
# Thay cairo: crate inknote-render duoc doi ten thanh piet-cairo de code Rnote giu nguyen (piet_cairo::CairoRenderContext)
piet-cairo = { package = "inknote-render", path = "../inknote-render" }
rand = "0.10.3"
rand_distr = "0.6.0"
rand_pcg = "0.10.2"
regex = "1.13"
rough_piet = "0.15.0"
roughr = "0.14.0"
serde = { version = "1.0", features = ["derive", "rc"] }
svg = "0.18.0"
tracing = "0.1.44"

[features]
clap-derive = ["dep:clap"]
