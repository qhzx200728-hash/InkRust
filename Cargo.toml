[workspace]
members = ["crates/inknote-pen", "crates/inknote-render", "crates/inknote-core", "crates/inknote-app"]
exclude = ["spike", "reference"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

# Giong Rnote: dung ban piet tu git (cung commit) de tuong thich rough_piet.
[patch.crates-io]
piet = { git = "https://github.com/linebender/piet", rev = "22210f03b8a2b203e2ad5ba9b600ed17f4a9407a" }

[profile.dev]
opt-level = 2
debug-assertions = false

